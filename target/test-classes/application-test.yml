spring:
  datasource:
    url: jdbc:h2:mem:inditexdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS ZARA\;SET SCHEMA ZARA
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ZARA
  flyway:
    enabled: true
    schemas: ZARA
    locations: classpath:db/migration
prices:
  messaging:
    kafka:
      enabled: false
