# Datasource externalizado.
#
# ATENCION: el valor por defecto sigue siendo H2 EN MEMORIA, es decir SIN
# PERSISTENCIA. Los datos se pierden en cada reinicio (Flyway los regenera).
# Este perfil NO es una configuracion de produccion real: es un placeholder
# para que la prueba arranque sin dependencias externas.
#
# Para produccion hay que fijar como minimo PRICES_DB_URL, PRICES_DB_DRIVER,
# PRICES_DB_USER y PRICES_DB_PASSWORD apuntando al motor real. Ver README,
# seccion "Base de datos".
spring:
  datasource:
    url: '${PRICES_DB_URL:jdbc:h2:mem:inditexpro;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS ZARA\;SET SCHEMA ZARA}'
    driver-class-name: '${PRICES_DB_DRIVER:org.h2.Driver}'
    username: '${PRICES_DB_USER:sa}'
    password: '${PRICES_DB_PASSWORD:}'
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: '${PRICES_DB_SCHEMA:ZARA}'
  flyway:
    enabled: true
    schemas: '${PRICES_DB_SCHEMA:ZARA}'
    locations: '${PRICES_FLYWAY_LOCATIONS:classpath:db/migration}'
  kafka:
    bootstrap-servers: '${PRICES_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
prices:
  messaging:
    kafka:
      enabled: '${PRICES_KAFKA_ENABLED:true}'
      topic: '${PRICES_KAFKA_TOPIC:prices.price-changed.v1}'