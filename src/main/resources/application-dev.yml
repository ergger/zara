# Datasource externalizado.
#
# Por defecto usa H2 EN MEMORIA (volatil): los datos se pierden al reiniciar,
# pero Flyway recrea esquema y datos de ejemplo en cada arranque.
#
# Para persistir en un motor real basta sobreescribir con variables de entorno,
# sin tocar codigo ni este fichero. Ejemplo PostgreSQL:
#
#   export PRICES_DB_URL=jdbc:postgresql://localhost:5432/prices
#   export PRICES_DB_DRIVER=org.postgresql.Driver
#   export PRICES_DB_USER=prices
#   export PRICES_DB_PASSWORD=secret
#
# NOTA: para PostgreSQL/Oracle hay que anadir el driver correspondiente como
# dependencia en pom.xml (scope runtime). Ver README, seccion "Base de datos".
spring:
  datasource:
    url: '${PRICES_DB_URL:jdbc:h2:mem:inditexdev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS ZARA\;SET SCHEMA ZARA}'
    driver-class-name: '${PRICES_DB_DRIVER:org.h2.Driver}'
    username: '${PRICES_DB_USER:sa}'
    password: '${PRICES_DB_PASSWORD:}'
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: '${PRICES_DB_SCHEMA:ZARA}'
  flyway:
    enabled: true
    schemas: '${PRICES_DB_SCHEMA:ZARA}'
    locations: '${PRICES_FLYWAY_LOCATIONS:classpath:db/migration}'
  h2:
    console:
      enabled: '${PRICES_H2_CONSOLE:true}'
      path: /h2-console
  kafka:
    bootstrap-servers: '${PRICES_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
prices:
  messaging:
    kafka:
      enabled: '${PRICES_KAFKA_ENABLED:true}'
      topic: '${PRICES_KAFKA_TOPIC:prices.price-changed.v1}'